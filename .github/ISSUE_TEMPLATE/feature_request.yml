# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Feature Request
description: Suggest an enhancement for crypto-service-sdk-python
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        The SDK is a thin client: cryptography lives in crypto-server. A
        new capability usually starts as a server route in
        https://github.com/sebastienrousseau/crypto-service.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Real-World Use Case
    validations:
      required: true
  - type: dropdown
    id: breaking_change
    attributes:
      label: Breaking Change?
      options:
        - "No"
        - "Yes"
    validations:
      required: true

#
# atheris (libFuzzer for Python) on the problem-body parser and the
# success-response decoder, 60 seconds per target on every pull request
# and longer weekly. Crash reproducers are uploaded as an artifact; the
# seed corpus also replays in the unit tests on every run.
name: Fuzz

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/*"]
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: atheris (${{ github.event_name == 'schedule' && '600' || '60' }} s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.1"
      - name: Fuzz every target
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: make fuzz FUZZ_SECONDS="$FUZZ_SECONDS"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

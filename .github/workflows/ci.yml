# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint (version files, the generated blocking client, ruff, mypy
# --strict, the complexity ceilings, shellcheck, pip-audit), the unit
# tests on Python 3.11 to 3.14 at 100% line and branch coverage, the
# sdist and wheel, the API compatibility check against the last tag, and
# the conformance kit, every example, every README block and a benchmark
# smoke run against a live crypto-server built at ci/server.ref.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Versions, lint, types, complexity, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Locked environment
        run: make sync
      - name: Version files agree
        run: make versions
      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh scripts/verify-release-versions
      - name: The blocking client is generated from the async one
        run: make unasync-check
      - name: ruff lint and format
        run: make lint format-check
      - name: mypy --strict
        run: make typecheck
      - name: Complexity ceilings (cyclomatic, cognitive, Halstead, lines)
        run: make complexity
      - name: Known vulnerabilities in locked dependencies (pip-audit)
        run: make audit

  test:
    name: Unit tests and coverage (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Unit tests, gate at 100% line and branch
        run: make sync coverage
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: sdist and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Build and check the metadata
        run: make sync build
      - name: The wheel installs and imports in a clean environment
        run: |
          python3 -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c 'import crypto_service; print(crypto_service.USER_AGENT)'

  api:
    name: API compatibility with the last tag (griffe)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Find the last release tag
        id: baseline
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] || echo "No v* tag yet: the gate starts with the first release."
      - name: Public API against the last tag (the gate)
        if: steps.baseline.outputs.tag != ''
        env:
          TAG: ${{ steps.baseline.outputs.tag }}
        run: uvx --from griffe==2.4.1 griffe check crypto_service --search src --against "$TAG"
      - name: Public API against main (informational, no tag yet)
        if: steps.baseline.outputs.tag == ''
        run: |
          uvx --from griffe==2.4.1 griffe check crypto_service --search src \
            --against "$(git merge-base HEAD origin/main)" || echo "informational only"

  conformance:
    name: Conformance kit, examples and README against crypto-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRYPTO_SERVICE_URL: http://127.0.0.1:3106
      # Synthetic credentials: the server requires them, the kit mints
      # tokens with the JWT secret, the examples send the API key.
      CRYPTO_SERVICE_API_KEY: ci-synthetic-api-key-0123456789abcdef
      CRYPTO_SERVICE_JWT_SECRET: ci-synthetic-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned server commit
        id: server
        run: echo "ref=$(cat ci/server.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/crypto-service
          ref: ${{ steps.server.outputs.ref }}
          path: server
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the server
        working-directory: server
        run: pnpm install --frozen-lockfile && pnpm -r run build
      - name: Start crypto-server
        run: |
          cd server
          CRYPTO_API_KEY="$CRYPTO_SERVICE_API_KEY" JWT_SECRET="$CRYPTO_SERVICE_JWT_SECRET" \
            PORT=3106 HOST=127.0.0.1 NODE_ENV=development RATE_LIMIT_MAX=100000 \
            nohup node packages/crypto-server/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$CRYPTO_SERVICE_URL/health"; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Conformance kit (fails on any skip)
        run: make sync conformance
      - name: Every example against the server
        run: make examples
      - name: Every README code block
        run: make readme
      - name: Benchmark smoke run (client side and loopback, not asserted)
        run: make bench BENCH_ARGS="--benchmark-min-rounds=5 --benchmark-max-time=0.1"
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
